<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Look - Mission Control</title>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --bg-base: theme('colors.zinc.950');
            --bg-surface: theme('colors.zinc.900');
            --bg-surface-hover: theme('colors.zinc.800');
            --border-subtle: theme('colors.zinc.800');
            --text-main: theme('colors.zinc.50');
            --text-muted: theme('colors.zinc.400');
            
            --tier-top: theme('colors.emerald.500');
            --tier-strong: theme('colors.blue.500');
            --tier-review: theme('colors.amber.500');
            --tier-reject: theme('colors.zinc.500');
        }
    }
    @layer base {
        body {
            @apply bg-[var(--bg-base)] text-[var(--text-main)] antialiased selection:bg-zinc-800;
        }
    }
    @layer components {
        .btn-primary {
            @apply px-4 py-2 bg-zinc-100 text-zinc-900 font-medium rounded-lg hover:bg-white transition-colors text-sm;
        }
        .btn-secondary {
            @apply px-4 py-2 bg-zinc-800 text-zinc-100 font-medium rounded-lg hover:bg-zinc-700 transition-colors text-sm border border-zinc-700;
        }
        .card {
            @apply bg-[var(--bg-surface)] border border-[var(--border-subtle)] rounded-2xl overflow-hidden;
        }
        .badge {
            @apply px-2 py-0.5 rounded-md text-xs font-medium border;
        }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <!-- Supabase client removed from static bundle for security. Use Next.js client helpers (src/lib/supabase/client.ts) and set NEXT_PUBLIC_SUPABASE_* env vars. -->
        <script type="text/babel" src="lib/api.js"></script>
        <script type="text/babel" src="lib/mock-data.js"></script>
    <script type="text/babel" src="components/layout/Sidebar.js"></script>
    <script type="text/babel" src="components/layout/PageShell.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
